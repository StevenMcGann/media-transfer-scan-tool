name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest   # PowerShell 7 (pwsh) is preinstalled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no job pushes back — don't leave the token in git config

      - name: Show pwsh version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Install Pester 5.7.1
        shell: pwsh
        run: |
          # PSGallery is occasionally unregistered on fresh runner images — register it first.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction SilentlyContinue
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Generate synthetic fixtures
        shell: pwsh
        # corpus/native/ and the corrupt/traversal wheels are gitignored
        # (regenerated deterministically) — build them before the suite runs.
        run: python tests/fixtures/build_fixtures.py

      - name: Run tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -CI

      - name: Test the pinned operator-bundle runtime
        shell: pwsh
        run: |
          # Hosted pwsh can be newer than the offline bundle. Exercise the full
          # suite on the actual pinned runtime as well (including ZIP APIs).
          $bundleScript = Get-Content ./bundle/build-bundle.ps1 -Raw
          $pin = [regex]::Match($bundleScript, '\$PwshVersion\s*=\s*''([^'']+)''')
          if (-not $pin.Success) { throw 'Could not read the bundled PowerShell version pin.' }
          $version = $pin.Groups[1].Value
          $runtimeDir = Join-Path $env:RUNNER_TEMP "mts-pwsh-$version"
          $runtimeZip = "$runtimeDir.zip"
          Invoke-WebRequest "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip" -OutFile $runtimeZip
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeDir
          $pwsh = Join-Path $runtimeDir 'pwsh.exe'
          & $pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString(); [System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription'
          & $pwsh -NoProfile -File ./tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test — operator entry point (cmd -> WinPS 5.1 -> bootstrap -> pwsh 7 -> engine)
        shell: cmd
        # Faithfully runs the real operator chain via Scan.cmd. The committed
        # sample fixture contains a Python script disguised as .txt, so the
        # classifier yields HIGH -> the engine exits 10. -Mode offline skips tool
        # installation (provisioning is covered by the Pester suite); the value
        # here is the 5.1->7 handoff + exit-code propagation, which unit tests
        # can't exercise. (A comma-list -DisableAnalyzers does not bind through
        # -File, so offline mode is the reliable fast path.)
        run: |
          call Scan.cmd -Path tests\fixtures\sample -Profile core -Mode offline
          set RC=%ERRORLEVEL%
          echo Scan.cmd exit code: %RC%
          if not "%RC%"=="10" (echo Expected exit 10 from disguised fixture, got %RC% & exit /b 1)
          if not exist tests\fixtures\sample\.reports\*.html (echo No HTML report produced & exit /b 1)
          echo Smoke OK: bootstrapper resolved pwsh 7, engine ran, exit 10, report present.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results
          path: tests/test-results.xml
