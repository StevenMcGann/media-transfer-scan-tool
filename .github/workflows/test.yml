name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest   # PowerShell 7 (pwsh) is preinstalled
    steps:
      - uses: actions/checkout@v5

      - name: Show pwsh version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Generate synthetic fixtures
        shell: pwsh
        # corpus/native/ and the corrupt/traversal wheels are gitignored
        # (regenerated deterministically) — build them before the suite runs.
        run: python tests/fixtures/build_fixtures.py

      - name: Run tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pester-results
          path: tests/test-results.xml
