version: 2
updates:
  # Keep GitHub Actions current — auto-PRs when an action publishes a new version.
  # This is what removes the Node-20-deprecation treadmill going forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    # CodeQL init/analyze must run at the same version — bumping them in
    # separate PRs leaves a mixed-version workflow that fails analysis.
    # Group them (and batch other minor/patch bumps) into single PRs;
    # majors still arrive individually for closer review.
    groups:
      codeql:
        patterns:
          - github/codeql-action*
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
